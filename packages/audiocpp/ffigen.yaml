# Regenerate the low-level bindings after editing src/include/audiocpp_ffi.h:
#
#   cd packages/audiocpp && dart run ffigen --config ffigen.yaml
#
# The generated file is committed so that consumers do not need libclang just to
# build the app.
name: AudioCppBindings
description: |
  Low-level bindings to libaudiocpp_ffi, generated from audiocpp_ffi.h.

  Do not edit by hand and do not use directly from application code -- the typed
  API in package:audiocpp owns handle lifetimes and error translation.
output: 'lib/src/ffi/audiocpp_bindings.g.dart'
headers:
  entry-points:
    - 'src/include/audiocpp_ffi.h'
  include-directives:
    - '**audiocpp_ffi.h'

# Classic DynamicLibrary-backed class rather than @Native: the dylib is opened
# at runtime by AudioCppLibrary, which also handles the dev/bundled path split.
preamble: |
  // GENERATED CODE - DO NOT MODIFY BY HAND.
  // Regenerate with: dart run ffigen --config ffigen.yaml
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
  // ignore_for_file: unused_element, unused_field, public_member_api_docs, constant_identifier_names

functions:
  include:
    - 'audiocpp_.*'
structs:
  include:
    - 'audiocpp_.*'
enums:
  include:
    - 'audiocpp_.*'
macros:
  include:
    - 'AUDIOCPP_FFI_ABI_VERSION_.*'
silence-enum-warning: true
comments:
  style: any
  length: full
