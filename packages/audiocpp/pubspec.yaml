name: audiocpp
description: >-
  Dart FFI bindings for the audio.cpp inference engine, with a typed API for
  running audio generation models such as MiniMax Music 3.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^19.0.0

flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      ios:
        ffiPlugin: true
